<div class="weather-ticker" id="weather-ticker">

          <span class="weather-ticker__icon">&#127749;</span>

        </span>

          <span class="weather-ticker__icon">&#9728;&#65039;</span>

        </span>

        </span>
      </div>
      <div class="weather-ticker__content" id="weather-content-2">
