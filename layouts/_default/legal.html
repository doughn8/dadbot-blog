{{ define "main" }}
{{ $css := resources.Get "css/legal.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
<article class="post legal-page">
  <h1 class="post-title">{{ .Title }}</h1>
  <div class="post-content">{{ .Content }}</div>
</article>
{{ end }}
